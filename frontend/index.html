<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Real-Time KYC</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <div class="container">
    <h1>Real-Time KYC Verification</h1>
    <p class="subtitle">Position your face in the frame below</p>

    <!-- -------------------------------------------------------
      The video element shows the live camera feed.
      "autoplay" starts it immediately.
      "playsinline" needed for mobile browsers.
      "muted" prevents audio feedback.
    -------------------------------------------------------- -->
    <div class="video-wrapper">
      <video id="video" autoplay playsinline muted></video>

      <!-- This canvas sits on top of the video.
           In Step 3, we'll draw face landmarks on it.
           For now it's invisible. -->
      <canvas id="overlay"></canvas>
    </div>

    <!-- Status bar — shows what's happening in real time -->
    <div class="status-bar">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Starting camera...</span>
    </div>

    <!-- Shows the server's response to each frame we send -->
    <div class="server-response" id="serverResponse">
      Waiting for server...
    </div>

  </div>

  <!-- Load our JavaScript file -->
  <script src="/static/app.js"></script>
</body>
</html>
